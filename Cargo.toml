[package]
name = "telysta"
version = "0.2.0"
edition = "2024"
rust-version = "1.93"
description = "A calm, accessible Rust desktop studio for creating EPUB, PDF and CBZ books."
license = "MIT"
default-run = "telysta"
build = "build.rs"

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:rfd", "dep:open"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
eframe = { version = "0.33.3", default-features = false, features = ["accesskit", "default_fonts", "glow", "persistence", "wayland", "x11"], optional = true }
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "tiff"] }
lopdf = { version = "0.47", default-features = false }
open = { version = "5", optional = true }
rfd = { version = "0.17", optional = true }
sevenz-rust2 = { version = "0.25", default-features = false, features = ["aes256", "bzip2", "ppmd"] }
tar = "0.4"
tempfile = "3"
time = { version = "0.3", features = ["formatting", "macros"] }
unrar = "0.5.8"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
zip = { version = "9.4", default-features = false, features = ["deflate-flate2", "deflate64", "bzip2", "lzma", "xz"] }

[build-dependencies]
winresource = "0.1"

[patch.crates-io]
# Upstream 0.5.8 detects the build host instead of the target in build.rs.
# This small vendored patch makes Windows cross-compilation and static linking work.
unrar_sys = { path = "vendor/unrar_sys" }

[dev-dependencies]
quick-xml = "0.41"
sevenz-rust2 = { version = "0.25", features = ["compress", "util"] }

[[bin]]
name = "telysta"
path = "src/main.rs"
required-features = ["gui"]

[[bin]]
name = "telysta-cli"
path = "src/bin/cli.rs"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
